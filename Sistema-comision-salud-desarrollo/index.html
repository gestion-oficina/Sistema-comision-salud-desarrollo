<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Comisión de Salud</title>
    <style>
        /* Estilos generales */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        /* Sección de Contacto */
        .contacto-seccion {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .contacto-seccion h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .contacto-seccion p {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 15px;
        }

        /* Campos del Formulario */
        .grupo-input {
            margin-bottom: 20px;
        }

        .grupo-input label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
            font-size: 14px;
        }

        .grupo-input input,
        .grupo-input textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccd1d1;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .grupo-input input:focus,
        .grupo-input textarea:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        /* Botón de Enviar */
        .btn-enviar {
            width: 100%;
            background-color: #27ae60;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
        }

        .btn-enviar:hover {
            background-color: #219653;
        }

        .btn-enviar:active {
            transform: scale(0.98);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .contacto-seccion {
                padding: 20px;
                margin: 20px 10px;
            }
        }
    </style>
</head>
<body>

    <section id="contacto" class="contacto-seccion">
        <h2>Contacto</h2>
        <p>Ponte en contacto con la comisión. Envíanos tu mensaje y te responderemos a la brevedad.</p>
        
        <!-- Recuerda cambiar 'tu-id-de-formspree' por el código que te asigne Formspree al registrar comisiondesaludgestion2025@gmail.com -->
        <form action="https://formspree.io/f/tu-id-de-formspree" method="POST" class="formulario-contacto">
            
            <div class="grupo-input">
                <label for="nombre">Nombre y Apellido</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre completo">
            </div>

            <div class="grupo-input">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required placeholder="tu-correo@example.com">
            </div>

            <div class="grupo-input">
                <label for="telefono">Teléfono / WhatsApp</label>
                <input type="tel" id="telefono" name="telefono" placeholder="0412-0000000">
            </div>

            <div class="grupo-input">
                <label for="mensaje">Mensaje o Solicitud</label>
                <textarea id="mensaje" name="mensaje" rows="5" required placeholder="Escribe tu mensaje aquí..."></textarea>
            </div>

            <!-- Campo oculto para personalizar el asunto del correo que recibes -->
            <input type="hidden" name="_subject" value="Nuevo mensaje desde la Web de la Comisión de Salud">

            <button type="submit" class="btn-enviar">Enviar Mensaje</button>
        </form>
    </section>

</body>
</html>
