<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Moderno - Entradas</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 2rem;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 2rem auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        header h1 {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Grid moderno para las entradas */
        .grid-entradas {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        /* Tarjeta moderna */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            font-size: 1.25rem;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        .card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.25rem;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #94a3b8;
            border-top: 1px solid var(--border-color);
            padding-top: 0.75rem;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.875rem;
            transition: background-color 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .loading, .error {
            text-align: center;
            grid-column: 1 / -1;
            padding: 3rem;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Panel de Entradas</h1>
        <button class="btn" onclick="cargarEntradas()">Actualizar Datos</button>
    </header>

    <main class="container">
        <div id="contenedor-entradas" class="grid-entradas">
            <div class="loading">Cargando entradas desde el sistema...</div>
        </div>
    </main>

    <!-- SDK de Supabase (puedes ajustarlo según tu implementación) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configuración de Supabase (Sustituye con tus credenciales seguras o variables de entorno)
        const SUPABASE_URL = 'TU_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'TU_SUPABASE_ANON_KEY';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function cargarEntradas() {
            const contenedor = document.getElementById('contenedor-entradas');
            contenedor.innerHTML = '<div class="loading">Sincronizando información...</div>';

            try {
                // Supongamos que tu tabla en Supabase se llama 'entradas'
                const { data, error } = await supabaseClient
                    .from('entradas')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    contenedor.innerHTML = '<div class="loading">No hay entradas registradas en el sistema.</div>';
                    return;
                }

                contenedor.innerHTML = '';

                data.forEach(item => {
                    const fechaFormateada = new Date(item.created_at).toLocaleDateString('es-ES', {
                        year: 'numeric', month: 'short', day: 'numeric'
                    });

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div>
                            <h3>${item.titulo || 'Sin título'}</h3>
                            <p>${item.descripcion || item.contenido || 'Sin descripción disponible.'}</p>
                        </div>
                        <div class="card-footer">
                            <span>${fechaFormateada}</span>
                            <span style="font-weight: 600; color: var(--accent-color);">${item.estado || 'Activo'}</span>
                        </div>
                    `;
                    contenedor.appendChild(card);
                });

            } catch (err) {
                console.error('Error al conectar con la base de datos:', err);
                contenedor.innerHTML = `<div class="error">Hubo un error al cargar las entradas del sistema. Verifica la conexión.</div>`;
            }
        }

        // Ejecutar al cargar la página
        document.addEventListener('DOMContentLoaded', cargarEntradas);
    </script>
</body>
</html>
