<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comisión Permanente de Salud y Desarrollo Social Integral</title>
    <!-- Leaflet CSS para el Mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="header-container">
            <h1>Comisión Permanente de Salud y Desarrollo Social Integral</h1>
            <button id="themeToggle" class="theme-btn">Cambiar Tema</button>
        </div>
    </header>

    <main class="container">
        <!-- Sección del Mapa Territorial -->
        <section class="card">
            <h2>Ubicación Territorial - Guarenas</h2>
            <div id="map" class="map-container"></div>
        </section>

        <!-- Sección de Galería Multimedia (Imágenes y Videos) -->
        <section class="card">
            <h2>Galería Multimedia</h2>
            <div class="gallery-grid" id="galleryContainer">
                <!-- Ítem de Video -->
                <div class="gallery-item">
                    <video controls preload="metadata" class="media-element">
                        <source src="assets/video_ejemplo.mp4" type="video/mp4">
                        Tu navegador no soporta la reproducción de video.
                    </video>
                    <div class="media-caption">Resumen de actividad social en Guarenas</div>
                </div>
                <!-- Ítem de Imagen -->
                <div class="gallery-item">
                    <img src="assets/imagen_ejemplo.jpg" alt="Actividad institucional" class="media-element">
                    <div class="media-caption">Jornada integral de salud</div>
                </div>
            </div>
        </section>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
