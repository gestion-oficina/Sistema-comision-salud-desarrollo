<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comisión Permanente de Salud - Portal Oficial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <!-- Barra de Navegación con Botón de Acceso al Sistema -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-heart-pulse me-2"></i>Comisión de Salud</a>
            <div class="ms-auto">
                <a href="/login" class="btn btn-light btn-sm fw-semibold text-primary shadow-sm">
                    <i class="fa-solid fa-right-to-bracket me-1"></i> Acceder al Sistema
                </a>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal: Eventos de Salud Publicados -->
    <div class="container my-5">
        <div class="row mb-4">
            <div class="col-12 text-center">
                <h2 class="fw-bold text-dark">Actividades y Jornadas de Salud</h2>
                <p class="text-muted">Registro público de eventos y gestiones adelantadas para la comunidad.</p>
            </div>
        </div>

        <div class="row">
            <!-- Aquí tu backend recorre los resultados de: 
                 SELECT * FROM bitacora_eventos WHERE publicar_web = 1 AND seccion_web = 'salud' ORDER BY id DESC; -->
             
            <!-- Ejemplo de estructura de tarjeta para cada evento -->
            <div class="col-md-4 mb-4">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body">
                        <span class="badge bg-success mb-2">Salud</span>
                        <h5 class="card-title fw-bold">Jornada de Atención</h5>
                        <p class="text-muted small mb-2"><i class="fa-regular fa-calendar-days me-1"></i> Fecha del evento</p>
                        <p class="card-text text-secondary">Descripción detallada de la jornada realizada para el beneficio de los ciudadanos...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
