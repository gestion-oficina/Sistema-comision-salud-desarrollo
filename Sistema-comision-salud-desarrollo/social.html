<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comisión de Salud y Desarrollo Social</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SQLite Cloud JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@sqlitecloud/drivers"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- Header Principal -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">Sistema de Gestión - Comisión de Salud</h1>
            <span id="estado-conexion" class="text-xs bg-yellow-500 text-white px-2.5 py-1 rounded-full font-medium">Conectando a SQLite Cloud...</span>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Panel de Control / Acciones -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <div class="w-full md:w-1/3">
                <input type="text" id="buscador" placeholder="Buscar por nombre o cédula..." class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex gap-2 w-full md:w-auto justify-end">
                <button onclick="cargarCasos()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg font-medium transition">Actualizar</button>
            </div>
        </div>

        <!-- Tabla de Registros -->
        <div class="bg-white shadow-md rounded-lg overflow-hidden border border-gray-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 uppercase text-xs tracking-wider border-b">
                            <th class="py-3 px-4">ID</th>
                            <th class="py-3 px-4">Nombre</th>
                            <th class="py-3 px-4">Cédula</th>
                            <th class="py-3 px-4">Teléfono</th>
                            <th class="py-3 px-4">Sector</th>
                            <th class="py-3 px-4">Tipo de Ayuda</th>
                            <th class="py-3 px-4">Estatus</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-cuerpo" class="divide-y divide-gray-200 text-sm">
                        <tr>
                            <td colspan="7" class="text-center py-6 text-gray-400">Cargando registros desde la base de datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Lógica de Conexión y Gestión con SQLite Cloud -->
    <script>
        // Configura tu cadena de conexión a SQLite Cloud (asegúrate de incluir las credenciales y el nombre de tu base de datos)
        const connectionString = "sqlitecloud://tu-usuario:tu-password@tu-host.sqlite.cloud:8860?sqlitecloud_database=sistema_gestion.sqlite";
        
        let db;

        async function inicializarBaseDeDatos() {
            const badge = document.getElementById('estado-conexion');
            try {
                // Inicializa el cliente de SQLite Cloud
                db = new Database(connectionString);
                
                // Prueba de conexión rápida
                await db.sql`SELECT 1;`;
                
                badge.textContent = "Conectado a SQLite Cloud";
                badge.className = "text-xs bg-green-500 text-white px-2.5 py-1 rounded-full font-medium";
                
                // Cargar los datos iniciales en la tabla
                cargarCasos();
            } catch (error) {
                console.error("Error al conectar con SQLite Cloud:", error);
                badge.textContent = "Error de conexión";
                badge.className = "text-xs bg-red-500 text-white px-2.5 py-1 rounded-full font-medium";
            }
        }

        async function cargarCasos() {
            const tbody = document.getElementById('tabla-cuerpo');
            tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-gray-400">Consultando datos...</td></tr>`;

            try {
                // Consulta compatible con SQLite Cloud
                const resultados = await db.sql`SELECT id, nombre, cedula, telefono, sector, tipo_ayuda, estatus FROM casos_salud ORDER BY id DESC LIMIT 50;`;
                
                tbody.innerHTML = "";

                if (resultados.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-gray-400">No se encontraron registros.</td></tr>`;
                    return;
                }

                resultados.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50 transition";
                    tr.innerHTML = `
                        <td class="py-3 px-4 font-mono text-gray-500">${row.id || ''}</td>
                        <td class="py-3 px-4 font-medium text-gray-900">${row.nombre || 'N/D'}</td>
                        <td class="py-3 px-4">${row.cedula || 'N/D'}</td>
                        <td class="py-3 px-4">${row.telefono || 'N/D'}</td>
                        <td class="py-3 px-4">${row.sector || 'N/D'}</td>
                        <td class="py-3 px-4">${row.tipo_ayuda || 'N/D'}</td>
                        <td class="py-3 px-4"><span class="px-2 py-1 text-xs rounded-full bg-blue-50 text-blue-700 font-semibold">${row.estatus || 'Registrado'}</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Error al cargar los casos:", error);
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-red-500">Error al obtener los datos de la tabla.</td></tr>`;
            }
        }

        // Ejecutar al cargar la página
        window.addEventListener('DOMContentLoaded', () => {
            inicializarBaseDeDatos();
        });
    </script>
</body>
</html>
